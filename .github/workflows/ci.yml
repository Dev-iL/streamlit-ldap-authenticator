name: CI

on:
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenLDAP system libraries
        run: sudo apt-get install -y libldap-dev libsasl2-dev

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - uses: j178/prek-action@v2
